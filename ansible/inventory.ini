[routers]
target

[routers:vars]
# TODO: configure the connection required by your Ansible solution.
ansible_host={{ router }}
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user={{ lookup('env', 'ROUTER_USER') }}
ansible_password={{ lookup('env', 'ROUTER_PASS') }}
ansible_network_cli_ssh_type=paramiko
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa